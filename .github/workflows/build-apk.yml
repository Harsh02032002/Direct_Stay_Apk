name: Build DirectStay Admin APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Signed Release & Debug APK
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      JAVA_OPTS: "-Xmx4096m"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Preinstalled Android SDK Licenses
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install NPM dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure Android native directory, Release Keystore & permissions
        run: |
          if [ ! -f "android/gradlew" ]; then
            CI=1 npx expo prebuild --platform android --no-install
          fi
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
          if [ ! -f "android/app/directstay-release.keystore" ]; then
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore android/app/directstay-release.keystore \
              -alias directstay-admin-key \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "DirectStay@2026" -keypass "DirectStay@2026" \
              -dname "CN=DirectStay Admin, OU=Hospitality PMS, O=DirectStay, L=New Delhi, ST=Delhi, C=IN"
          fi
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Build Signed Android Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Prepare Signed APK Output
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/DirectStay-Admin.apk
          ls -lh dist-apk/

      - name: Upload DirectStay Admin Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DirectStay-Admin-APK
          path: dist-apk/DirectStay-Admin.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Direct-Download APK on GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "DirectStay Admin Mobile APK (Latest)"
          prerelease: false
          files: |
            dist-apk/DirectStay-Admin.apk
